name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Export local Supabase environment
        shell: bash
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          source "$RUNNER_TEMP/supabase.env"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_URL=$API_URL"
          } >> "$GITHUB_ENV"

      - name: Reset and test database
        run: npm run db:reset && npm run db:test && npx supabase db lint --local --level warning

      - name: Run quality gate
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser journeys
        shell: bash
        run: |
          source "$RUNNER_TEMP/supabase.env"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"

          SUPABASE_URL="$API_URL" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          E2E_TEAM_LEADER_EMAIL="ci-team-leader@example.test" \
          E2E_TEAM_LEADER_PASSWORD="$password" \
          npm run auth:provision-local

          auth_response="$RUNNER_TEMP/auth-verification.json"
          auth_status="$(curl --silent --show-error \
            --output "$auth_response" \
            --write-out "%{http_code}" \
            --request POST \
            "$API_URL/auth/v1/token?grant_type=password" \
            --header "apikey: $PUBLISHABLE_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"email\":\"ci-team-leader@example.test\",\"password\":\"$password\"}")"
          if [[ "$auth_status" != "200" ]]; then
            node --input-type=module - "$auth_response" <<'NODE'
          import fs from "node:fs";

          const response = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const code = response.error_code ?? response.code ?? response.error ?? "unknown";
          console.error(`Direct local auth verification failed: ${code}`);
          NODE
            exit 1
          fi
          unlink "$auth_response"

          E2E_TEAM_LEADER_EMAIL="ci-team-leader@example.test" \
          E2E_TEAM_LEADER_PASSWORD="$password" \
          PLAYWRIGHT_WEB_SERVER_COMMAND="npm run start" \
          npm run test:e2e

      - name: Report local auth diagnostics
        if: failure()
        run: docker logs --tail 100 supabase_auth_passivefire 2>&1 || true

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
